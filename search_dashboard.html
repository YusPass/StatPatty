<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StatPatty</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3B5CE4;--bdim:rgba(59,92,228,.15);--bglow:rgba(59,92,228,.45);
  --org:#ff6b35;--odim:rgba(255,107,53,.12);
  --bg:#080808;--s1:#101010;--s2:#181818;--s3:#222;--s4:#2a2a2a;
  --bd:rgba(255,255,255,.07);--tx:#f0f0f0;--mu:#555;--mu2:#888;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh}

header{padding:10px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:200;background:rgba(8,8,8,.97);backdrop-filter:blur(14px)}
.logo{width:66px;height:66px;image-rendering:pixelated;object-fit:contain;flex-shrink:0}
header h1{font-family:'Bebas Neue';font-size:26px;letter-spacing:3px}
header h1 span{color:var(--blue)}

.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 80px)}

/* ── SIDEBAR ── */
.sidebar{border-right:1px solid var(--bd);padding:18px 14px 40px;
  position:sticky;top:80px;height:calc(100vh - 80px);overflow-y:auto;background:var(--s1)}
.sb-btn{width:100%;padding:10px;border-radius:9px;border:none;background:var(--blue);
  color:#fff;font-size:15px;font-family:'Bebas Neue';letter-spacing:2px;cursor:pointer;
  transition:all .2s;margin-bottom:16px}
.sb-btn:hover{background:#2d4bc0;box-shadow:0 0 14px var(--bglow)}

.fblock{margin-bottom:6px;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.fblock-head{display:flex;align-items:center;justify-content:space-between;
  padding:9px 13px;cursor:pointer;user-select:none;background:var(--s2);border-bottom:1px solid var(--bd)}
.fblock-head:hover{background:var(--s3)}
.fblock-title{font-family:'Bebas Neue';font-size:15px;letter-spacing:2px}
.fblock-title.inc{color:#fff}.fblock-title.exc{color:#ff8080}
.farrow{font-size:10px;color:var(--mu2);transition:transform .2s}
.fblock.open .farrow{transform:rotate(90deg)}
.fblock-body{display:none;padding:10px 11px 11px;background:var(--bg)}
.fblock.open .fblock-body{display:block}

.any-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mu2);margin-bottom:4px}
.tiw{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:6px 9px;
  border:1px solid var(--bd);border-radius:7px;background:var(--s1);cursor:text;min-height:36px}
.tiw.inc:focus-within{border-color:rgba(59,92,228,.5)}
.tiw.exc:focus-within{border-color:rgba(255,80,80,.5)}
.tiw input{flex:1;min-width:70px;background:none;border:none;outline:none;
  color:var(--tx);font-size:12px;font-family:'DM Sans',sans-serif}
.tiw input::placeholder{color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:12px;font-size:11px;font-weight:500}
.chip.inc{background:rgba(59,92,228,.2);color:#8ca0f5}
.chip.exc{background:rgba(255,50,50,.18);color:#ff9090}
.chip .x{cursor:pointer;opacity:.55;font-size:13px;line-height:1}.chip .x:hover{opacity:1}

.subfilter{margin-top:5px}
.sf-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;padding:4px 2px;
  font-size:12px;color:var(--mu2);user-select:none}
.sf-toggle:hover{color:var(--tx)}
.sf-arrow{font-size:9px;transition:transform .2s;display:inline-block}
.sf-toggle.open .sf-arrow{transform:rotate(90deg)}
.sf-body{display:none;padding:5px 0 2px 12px}
.sf-toggle.open+.sf-body{display:block}
.tiw.sub{background:var(--s2);border-radius:6px}
.sb-hint{font-size:11px;color:var(--mu);margin-top:12px;line-height:1.5}
.sb-hint kbd{background:var(--s3);border:1px solid var(--bd);border-radius:3px;padding:1px 4px;font-size:10px;font-family:monospace}

/* ── RESULTS PANE ── */
.rpane{padding:18px 22px 60px;min-width:0}
.rmeta{padding:0 0 10px;font-size:12px;color:var(--mu2)}.rmeta strong{color:var(--tx)}

.cstrip{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.cbtn{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:24px;
  border:1px solid var(--bd);background:var(--s1);color:var(--mu2);
  font-size:11px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.cbtn:hover{border-color:rgba(255,255,255,.2);color:var(--tx)}
.cbtn.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 8px var(--bglow)}
.ccount{font-size:9px;font-weight:700;opacity:.8;background:rgba(0,0,0,.2);padding:1px 4px;border-radius:6px}

.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--bd)}
.tbtn{padding:7px 14px;background:none;border:none;font-family:'DM Sans';font-size:12px;
  font-weight:500;color:var(--mu2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tbtn:hover{color:var(--tx)}
.tbtn.active{color:var(--tx);border-bottom-color:var(--blue)}
.tbtn.ctab.active{color:var(--org);border-bottom-color:var(--org)}
.tc{display:inline-block;font-size:10px;font-weight:600;padding:1px 5px;border-radius:8px;
  margin-left:4px;background:var(--s3);color:var(--mu2)}
.tbtn.active .tc{background:var(--bdim);color:var(--blue)}
.tbtn.ctab.active .tc{background:var(--odim);color:var(--org)}
.tpanel{display:none}.tpanel.active{display:block}

/* ── VIDEO + ANALYSIS GRID ── */
.vgrid{display:flex;flex-direction:column;gap:2px}
.vcard{display:grid;grid-template-columns:28px 1fr 120px 200px;align-items:stretch;
  gap:0;border-radius:9px;background:var(--s1);border:1px solid transparent;
  transition:all .15s;overflow:hidden}
.vcard:hover{background:var(--s2);border-color:var(--bd)}

.vcol-rank{display:flex;align-items:center;justify-content:center;padding:10px 4px;
  font-family:'Bebas Neue';font-size:19px;color:var(--mu);flex-shrink:0}
.vcol-rank.gold{color:#ffd700}.vcol-rank.silver{color:#c0c0c0}.vcol-rank.bronze{color:#cd7f32}

.vcol-info{padding:10px 10px 10px 6px;min-width:0;cursor:pointer;border-right:1px solid var(--bd)}
.vtitle{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.vmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.vch{font-size:11px;color:var(--mu2)}
.vcat{font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;padding:1px 5px;border-radius:6px}

.vcol-stats{padding:8px 10px;text-align:right;border-right:1px solid var(--bd);
  display:flex;flex-direction:column;justify-content:center;flex-shrink:0}
.vviews{font-family:'Bebas Neue';font-size:17px;letter-spacing:1px}
.vlbar{height:2px;border-radius:2px;margin:3px 0;background:var(--s4);overflow:hidden}
.vlbar-f{height:100%;background:var(--blue);border-radius:2px}
.vlt{font-size:10px;color:var(--mu2)}
.cbadge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;
  background:var(--odim);color:var(--org);text-transform:uppercase;display:inline-block;margin-top:2px}

/* ── ANALYSIS WIDGET ── */
.vcol-analysis{padding:8px 10px;font-size:10px;background:rgba(59,92,228,.04);
  display:flex;flex-direction:column;gap:4px;min-width:0}
.analysis-head{font-size:9px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--blue);font-weight:700;margin-bottom:2px;opacity:.8}
.analysis-row{display:flex;align-items:center;gap:5px}
.analysis-label{color:var(--mu2);font-size:9px;flex-shrink:0;width:38px}
.analysis-bar-wrap{flex:1;height:3px;background:var(--s4);border-radius:2px;overflow:hidden}
.analysis-bar{height:100%;border-radius:2px}
.analysis-pct{font-size:9px;color:var(--mu2);flex-shrink:0;width:26px;text-align:right}
.analysis-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:1px}
.atag{padding:1px 5px;border-radius:8px;font-size:9px;background:var(--s3);color:var(--mu2);
  border:1px solid rgba(255,255,255,.06);cursor:pointer}
.atag:hover{border-color:var(--blue);color:var(--blue)}
.atag.dominant{background:rgba(59,92,228,.15);color:#8ca0f5;border-color:rgba(59,92,228,.3)}

/* tag cloud */
.tag-section{margin-top:4px;padding:12px 14px;background:var(--s1);border:1px solid var(--bd);border-radius:9px}
.tag-section h3{font-family:'Bebas Neue';font-size:14px;letter-spacing:2px;color:var(--mu2);margin-bottom:8px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px}
.ttag{padding:4px 10px;border-radius:16px;font-size:11px;font-weight:500;
  border:1px solid var(--bd);background:var(--s2);color:var(--tx);cursor:pointer;transition:all .2s}
.ttag:hover{border-color:var(--blue);color:var(--blue)}
.ttag.big{font-size:12px;padding:5px 12px;border-color:rgba(59,92,228,.3);background:rgba(59,92,228,.07);color:#8ca0f5}
.ttag.mid{border-color:rgba(255,255,255,.11);color:#ccc}

.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.chcard{padding:11px 13px;border-radius:8px;background:var(--s1);border:1px solid var(--bd);
  display:flex;align-items:center;gap:9px;transition:background .15s}
.chcard:hover{background:var(--s2)}
.chavatar{width:30px;height:30px;border-radius:50%;background:var(--s4);display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;color:var(--mu2)}
.chname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chnote{font-size:9px;font-weight:600;color:var(--mu2);background:var(--s3);padding:1px 5px;border-radius:5px;display:inline-block;margin-top:2px}

.empty{text-align:center;padding:40px 20px;color:var(--mu2);font-size:13px}
.loading{text-align:center;padding:50px;color:var(--mu2);font-size:13px}
.spinner{width:22px;height:22px;border:2px solid var(--s4);border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.welcome{text-align:center;padding:60px 20px}
.welcome h2{font-family:'Bebas Neue';font-size:32px;letter-spacing:3px;margin-bottom:8px}
.welcome h2 span{color:var(--blue)}
.welcome p{font-size:13px;color:var(--mu2);max-width:400px;margin:0 auto;line-height:1.6}
.wchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.wchip{padding:5px 13px;border-radius:16px;background:var(--s2);border:1px solid var(--bd);
  color:var(--mu2);font-size:12px;cursor:pointer;transition:all .2s}
.wchip:hover{border-color:rgba(59,92,228,.4);color:var(--blue)}

/* POPUP */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;
  align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.popup{background:var(--s2);border:1px solid var(--bd);border-radius:14px;
  max-width:580px;width:100%;max-height:80vh;overflow-y:auto;padding:20px;position:relative}
.popup h2{font-size:14px;font-weight:600;margin-bottom:5px;line-height:1.4;padding-right:22px}
.popup-meta{font-size:11px;color:var(--mu2);margin-bottom:12px;display:flex;gap:7px;flex-wrap:wrap}
.popup-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.popup-stat{display:flex;flex-direction:column;gap:1px}
.popup-stat span:first-child{font-family:'Bebas Neue';font-size:19px;color:var(--tx)}
.popup-stat span:last-child{font-size:9px;color:var(--mu2);text-transform:uppercase;letter-spacing:.5px}
.popup-section{margin-bottom:10px}
.popup-section h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mu2);margin-bottom:5px}
.popup-desc{font-size:11px;color:var(--mu2);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.popup-tags{display:flex;flex-wrap:wrap;gap:4px}
.popup-tag{padding:2px 8px;border-radius:10px;font-size:10px;background:var(--s3);color:var(--mu2);border:1px solid var(--bd)}
.popup-close{position:absolute;top:16px;right:16px;background:none;border:none;
  color:var(--mu2);font-size:20px;cursor:pointer;line-height:1}
.popup-close:hover{color:var(--tx)}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bd)}
  .vcard{grid-template-columns:28px 1fr 100px}
  .vcol-analysis{display:none}
}
</style>
</head>

<script>
const FLAGS  = {BR:'🇧🇷',CA:'🇨🇦',DE:'🇩🇪',FR:'🇫🇷',GB:'🇬🇧',IN:'🇮🇳',JP:'🇯🇵',KR:'🇰🇷',MX:'🇲🇽',RU:'🇷🇺',US:'🇺🇸'};
const CNAMES = {BR:'Brazil',CA:'Canada',DE:'Germany',FR:'France',GB:'UK',IN:'India',JP:'Japan',KR:'S. Korea',MX:'Mexico',RU:'Russia',US:'USA'};
const CAT    = {1:'Film',2:'Autos',10:'Music',15:'Pets',17:'Sports',19:'Travel',20:'Gaming',22:'Blogs',23:'Comedy',24:'Entertainment',25:'News',26:'Howto',27:'Education',28:'Tech',29:'Nonprofits'};
const CATC   = {10:'#e63946',20:'#457b9d',24:'#f4a261',22:'#2a9d8f',1:'#8338ec',25:'#fb8500',17:'#06d6a0',26:'#ff6b9d',27:'#ffd60a',28:'#48cae4',23:'#80b918',2:'#adb5bd'};

const filters = {
  incAny:[],incTitle:[],incTags:[],incChannel:[],
  excAny:[],excTitle:[],excTags:[],excChannel:[]
};
let currentCountry='ALL', currentType='popular', lastResults=null, isAlltime=false;

const fmt = n => n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':String(n||0);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── SIDEBAR TOGGLES ──
function toggleBlock(id){ document.getElementById(id).classList.toggle('open'); }
function toggleSF(id){ document.getElementById(id).classList.toggle('open'); }

// ── TAG INPUTS ──
const INPUT_MAP = {
  incInput:      {key:'incAny',     wrap:'incWrap',        type:'inc'},
  incTitleInput: {key:'incTitle',   wrap:'incTitleWrap',   type:'inc'},
  incTagsInput:  {key:'incTags',    wrap:'incTagsWrap',    type:'inc'},
  incChannelInput:{key:'incChannel',wrap:'incChannelWrap', type:'inc'},
  excInput:      {key:'excAny',     wrap:'excWrap',        type:'exc'},
  excTitleInput: {key:'excTitle',   wrap:'excTitleWrap',   type:'exc'},
  excTagsInput:  {key:'excTags',    wrap:'excTagsWrap',    type:'exc'},
  excChannelInput:{key:'excChannel',wrap:'excChannelWrap', type:'exc'},
};
function addTag(key,val,wrapId,chipType){
  val=val.trim().toLowerCase(); if(!val)return;
  if(!filters[key].includes(val)){filters[key].push(val);renderWrap(key,wrapId,chipType);}
}
function removeTag(key,val,wrapId,chipType){
  filters[key]=filters[key].filter(t=>t!==val); renderWrap(key,wrapId,chipType);
}
function renderWrap(key,wrapId,chipType){
  const wrap=document.getElementById(wrapId), inp=wrap.querySelector('input');
  wrap.querySelectorAll('.chip').forEach(e=>e.remove());
  filters[key].forEach(t=>{
    const c=document.createElement('span');
    c.className='chip '+chipType;
    c.innerHTML=esc(t)+'<span class="x" onclick="removeTag(\''+key+'\',\''+t.replace(/'/g,"\'")
      +'\',\''+wrapId+'\',\''+chipType+'\')">\xd7</span>';
    wrap.insertBefore(c,inp);
  });
}
function setupInput(inputId){
  const cfg=INPUT_MAP[inputId], inp=document.getElementById(inputId), wrap=document.getElementById(cfg.wrap);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();const v=inp.value.trim();if(v){addTag(cfg.key,v,cfg.wrap,cfg.type);inp.value='';}else doSearch();}
    if(e.key==='Backspace'&&!inp.value){if(filters[cfg.key].length){filters[cfg.key].pop();renderWrap(cfg.key,cfg.wrap,cfg.type);}}
  });
  wrap.addEventListener('click',()=>inp.focus());
}
Object.keys(INPUT_MAP).forEach(setupInput);
const hasFilters=()=>Object.values(filters).some(a=>a.length>0);

function qs(kw){
  Object.keys(filters).forEach(k=>filters[k]=[]);
  Object.keys(INPUT_MAP).forEach(id=>{const cfg=INPUT_MAP[id];renderWrap(cfg.key,cfg.wrap,cfg.type);});
  filters.incAny=[kw]; renderWrap('incAny','incWrap','inc'); doSearch();
}

// ── ANALYSIS: compute stats for top N videos ──
function computeAnalysis(videos, primaryKw){
  const top = videos.slice(0,20);
  // Tag frequency
  const tagCount={}, chCount={};
  let totalViews=0;
  top.forEach(v=>{
    totalViews += v.v||0;
    (v.tg||'').split('|').forEach(t=>{
      t=t.trim().toLowerCase();
      if(t&&t!=='[none]'&&t.length>2){tagCount[t]=(tagCount[t]||0)+1;}
    });
    const ch=(v.ch||'').trim();
    if(ch) chCount[ch]=(chCount[ch]||0)+1;
  });
  // Primary kw presence in top videos
  const kwLow=(primaryKw||'').toLowerCase();
  const kwHits=kwLow?top.filter(v=>{
    const hay=(v.t+' '+(v.tg||'')+' '+(v.de||'')).toLowerCase();
    return hay.includes(kwLow);
  }).length:0;
  // Sort tags by count, exclude the primary kw
  const topTags=Object.entries(tagCount)
    .filter(([t])=>!kwLow||!t.includes(kwLow))
    .sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topCh=Object.entries(chCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return {kwHits, topTags, topCh, total:top.length, primaryKw:kwLow};
}

// ── SEARCH ──
async function doSearch(){
  Object.keys(INPUT_MAP).forEach(id=>{
    const cfg=INPUT_MAP[id],inp=document.getElementById(id),v=inp.value.trim();
    if(v){addTag(cfg.key,v,cfg.wrap,cfg.type);inp.value='';}
  });
  if(!hasFilters()){ loadAllTime(); return; }
  document.getElementById('resultsArea').innerHTML='<div class="loading"><div class="spinner"></div>Searching…</div>';
  const p=new URLSearchParams();
  if(filters.incAny.length)     p.set('inc_any',    filters.incAny.join(','));
  if(filters.incTitle.length)   p.set('inc_title',  filters.incTitle.join(','));
  if(filters.incTags.length)    p.set('inc_tags',   filters.incTags.join(','));
  if(filters.incChannel.length) p.set('inc_channel',filters.incChannel.join(','));
  if(filters.excAny.length)     p.set('exc_any',    filters.excAny.join(','));
  if(filters.excTitle.length)   p.set('exc_title',  filters.excTitle.join(','));
  if(filters.excTags.length)    p.set('exc_tags',   filters.excTags.join(','));
  if(filters.excChannel.length) p.set('exc_channel',filters.excChannel.join(','));
  try{
    const res=await fetch('/search?'+p);
    lastResults=await res.json(); isAlltime=false; globalTagStats=null; lastFetchedKw=null;
    currentCountry='ALL'; currentType='popular';
    renderResults(lastResults,false);
  }catch(e){
    document.getElementById('resultsArea').innerHTML='<div class="empty">⚠️ Connection error.</div>';
  }
}

async function loadAllTime(){
  document.getElementById('resultsArea').innerHTML='<div class="loading"><div class="spinner"></div>Loading all-time charts…</div>';
  try{
    const res=await fetch('/alltime');
    lastResults=await res.json(); isAlltime=true;
    currentCountry='ALL'; currentType='popular';
    renderResults(lastResults,true);
  }catch(e){
    document.getElementById('resultsArea').innerHTML='<div class="welcome"><h2>TRENDING <span>SEARCH</span></h2><p>Use the filters on the left to search.</p></div>';
  }
}
document.addEventListener('DOMContentLoaded',loadAllTime);

// ── COUNTRY / TAB ──
function selectCountry(code){
  currentCountry=code;
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('active',b.dataset.code===code));
  renderVideoSection(); updateTabCounts();
}
function switchType(type){
  currentType=type;
  document.querySelectorAll('.tbtn').forEach(b=>{
    b.classList.toggle('active',b.dataset.type===type);
    b.classList.toggle('ctab',b.dataset.type===type&&type==='controversial');
  });
  document.querySelectorAll('.tpanel').forEach(p=>p.classList.toggle('active',p.id==='tp-'+type));
  if(type!=='channels'&&type!=='tags') renderVideoSection();
}

function getVideos(type){
  if(!lastResults) return [];
  const t=type||currentType;
  // For alltime or when country=ALL, use top-level arrays
  if(isAlltime||currentCountry==='ALL')
    return t==='popular'?lastResults.popular:lastResults.controversial;
  const bc=lastResults.by_country&&lastResults.by_country[currentCountry];
  if(!bc) return [];
  return t==='popular'?bc.popular:bc.controversial;
}

function updateTabCounts(){
  const pv=getVideos('popular'), cv=getVideos('controversial');
  const pc=document.getElementById('popCount'), cc=document.getElementById('conCount');
  if(pc) pc.textContent=Math.min(pv.length,50);
  if(cc) cc.textContent=Math.min(cv.length,50);
}

// ── RENDER ──
function renderResults(data, alltime){
  const {total_matches,by_country,channel_only,top_tags}=data;
  const area=document.getElementById('resultsArea');
  if(!alltime&&total_matches===0&&(!channel_only||channel_only.length===0)){
    area.innerHTML='<div class="empty">🔍 No results found.</div>'; return;
  }
  const cBtns = alltime ? '' :
    ['ALL',...Object.keys(by_country||{})].map(code=>{
      const count=code==='ALL'?total_matches:(by_country[code]||{}).total||0;
      const label=code==='ALL'?'🌍 All':'<span style="font-size:13px">'+(FLAGS[code]||'')+'</span> '+(CNAMES[code]||code);
      return '<button class="cbtn'+(code==='ALL'?' active':'')+'" data-code="'+code+'" onclick="selectCountry(\''+code+'\')">'
        +label+' <span class="ccount">'+count+'</span></button>';
    }).join('');

  const chanTab=channel_only&&channel_only.length?'<button class="tbtn" data-type="channels" onclick="switchType(\'channels\')">📺 Channels <span class="tc">'+channel_only.length+'</span></button>':'';
  const tagsTab=top_tags&&top_tags.length?'<button class="tbtn" data-type="tags" onclick="switchType(\'tags\')">🏷️ Top Tags <span class="tc">'+top_tags.length+'</span></button>':'';

  const chanPanel=channel_only&&channel_only.length
    ?'<div id="tp-channels" class="tpanel"><div class="chgrid">'
      +channel_only.map(ch=>'<div class="chcard"><div class="chavatar">'+esc((ch.n||'?').substring(0,2).toUpperCase())+'</div>'
        +'<div><div class="chname">'+esc(ch.n)+'</div><div class="chnote">'+(FLAGS[ch.country]||ch.country)+' name match</div></div></div>').join('')
      +'</div></div>':'';

  const tagItems=top_tags?top_tags.map((t,i)=>{
    const cls=i<3?'big':i<8?'mid':'';
    return '<span class="ttag '+cls+'" title="'+t.count+' uses" onclick="qs(\''+esc(t.tag)+'\')">'+esc(t.tag)+'</span>';
  }).join(''):'';
  const tagsPanel=top_tags&&top_tags.length
    ?'<div id="tp-tags" class="tpanel"><div class="tag-section"><h3>Most Used Tags in Results</h3><div class="tag-cloud">'+tagItems+'</div></div></div>':'';

  area.innerHTML=
    '<div class="rmeta">'+(alltime
      ?'⭐ All-time top videos — <strong>'+total_matches.toLocaleString()+'</strong> total in dataset'
      :'Found <strong>'+total_matches.toLocaleString()+'</strong> matching videos'
        +(channel_only&&channel_only.length?' · <strong>'+channel_only.length+'</strong> channel-only':''))
    +'</div>'
    +(cBtns?'<div class="cstrip">'+cBtns+'</div>':'')
    +'<div class="tabs">'
    +'<button class="tbtn active" data-type="popular" onclick="switchType(\'popular\')">🔥 Most Popular <span class="tc" id="popCount">'+Math.min(data.popular.length,50)+'</span></button>'
    +'<button class="tbtn ctab" data-type="controversial" onclick="switchType(\'controversial\')">⚡ Most Controversial <span class="tc" id="conCount">'+Math.min(data.controversial.length,50)+'</span></button>'
    +chanTab+tagsTab+'</div>'
    +'<div id="tp-popular" class="tpanel active"></div>'
    +'<div id="tp-controversial" class="tpanel"></div>'
    +chanPanel+tagsPanel;

  renderVideoSection();
}

let globalTagStats = null;
let lastFetchedKw = null;

async function fetchGlobalTagStats(kw){
  if(!kw || kw === lastFetchedKw) return;
  lastFetchedKw = kw;
  try{
    const res = await fetch('/tag_stats?kw='+encodeURIComponent(kw));
    globalTagStats = await res.json();
    renderVideoSection(false);
  }catch(e){ globalTagStats = null; }
}

function renderVideoSection(fetchStats=true){
  const isC=currentType==='controversial';
  const vids=getVideos();
  const primaryKw=filters.incAny[0]||filters.incTitle[0]||filters.incTags[0]||'';
  const analysis=computeAnalysis(vids, primaryKw);
  const html2=vids.length===0
    ?'<div class="empty">No '+(isC?'controversial':'')+' results.</div>'
    :'<div class="vgrid">'+vids.map((v,i)=>videoCard(v,i,isC,analysis)).join('')+'</div>';
  const panel=document.getElementById('tp-'+currentType);
  if(panel) panel.innerHTML=html2;
  updateTabCounts();
  if(fetchStats && primaryKw) fetchGlobalTagStats(primaryKw);
}

function videoCard(v, i, isC, analysis){
  const rc=i===0?'gold':i===1?'silver':i===2?'bronze':'';
  const cc=CATC[v.cat]||'#666', cn=CAT[v.cat]||'';
  const lr=v.v>0?(v.l/v.v)*100:0;
  const flag=FLAGS[v.co]||v.co;
  const cat=cn?'<span class="vcat" style="background:'+cc+'22;color:'+cc+';border:1px solid '+cc+'44">'+cn+'</span>':'';
  const dv='data-v="'+esc(JSON.stringify(v))+'"';

  // Analysis column for this video
  const analysisCol = buildAnalysisCol(v, i, analysis);

  // Stats col
  let statsCol;
  if(!isC){
    statsCol='<div class="vcol-stats">'
      +'<div class="vviews">'+fmt(v.v)+'</div>'
      +'<div class="vlbar"><div class="vlbar-f" style="width:'+Math.min(lr*20,100)+'%"></div></div>'
      +'<div class="vlt">♥ '+fmt(v.l)+' 💬 '+fmt(v.c)+'</div>'
      +'</div>';
  } else {
    const lrp=lr.toFixed(1);
    const cr=v.v>0?((v.c/v.v)*100).toFixed(3):'0';
    const bad=[];
    if(lr<5) bad.push('♥'+lrp+'%');
    if(v.v>0&&v.c>0&&(v.c/v.v)<0.005) bad.push('💬'+cr+'%');
    statsCol='<div class="vcol-stats" style="border-color:rgba(255,107,53,.15)">'
      +'<div class="vviews">'+fmt(v.v)+'</div>'
      +(bad.length?'<div class="cbadge">⚡ '+bad.join(' ')+'</div>':'')
      +'<div class="vlt" style="margin-top:3px">♥ '+fmt(v.l)+' 💬 '+fmt(v.c)+'</div>'
      +'</div>';
  }

  return '<div class="vcard">'
    +'<div class="vcol-rank '+rc+'">'+(i+1)+'</div>'
    +'<div class="vcol-info" onclick="openPopup(this)" '+dv+'>'
      +'<div class="vtitle">'+esc(v.t)+'</div>'
      +'<div class="vmeta"><span class="vch">'+esc(v.ch)+'</span><span>'+flag+'</span>'+cat+'</div>'
    +'</div>'
    +statsCol
    +analysisCol
    +'</div>';
}

function buildAnalysisCol(v, idx, analysis){
  const vTags=(v.tg||'').split('|').map(t=>t.trim().toLowerCase()).filter(t=>t&&t!=='[none]'&&t.length>2);
  const kw=analysis.primaryKw;
  const domTags=new Set(analysis.topTags.map(([t])=>t));
  const tagPills=vTags.slice(0,6).map(t=>{
    const isDom=domTags.has(t)||(kw&&t.includes(kw));
    return '<span class="atag'+(isDom?' dominant':'')+'" onclick="qs(''+esc(t)+'')">'+esc(t)+'</span>';
  }).join('');

  let summary='';
  if(idx===0 && analysis.total>1){
    const topChEntries=analysis.topCh;
    const topTagEntries=analysis.topTags.slice(0,3);
    const rows=[];

    if(kw && globalTagStats && globalTagStats.kw===kw){
      const gs=globalTagStats;
      const refPct=gs.top_tags_for_context&&gs.top_tags_for_context.length?Math.max(gs.top_tags_for_context[0].pct,gs.exact_pct,0.01):10;
      const kwBarW=Math.min(gs.exact_pct/refPct*100,100);
      rows.push('<div class="analysis-head" style="margin-bottom:3px">Global Tag Popularity</div>');
      rows.push('<div class="analysis-row"><span class="analysis-label" title="'+esc(kw)+'" style="color:#8ca0f5;font-weight:700">'+esc(kw.substring(0,8))+'</span><div class="analysis-bar-wrap"><div class="analysis-bar" style="width:'+kwBarW.toFixed(1)+'%;background:var(--blue)"></div></div><span class="analysis-pct" style="color:var(--blue);font-weight:700">'+gs.exact_pct.toFixed(2)+'%</span></div>');
      if(gs.top_tags_for_context) gs.top_tags_for_context.slice(0,2).forEach(t=>{
        const w=Math.min(t.pct/refPct*100,100);
        rows.push('<div class="analysis-row"><span class="analysis-label" title="'+esc(t.tag)+'">'+esc(t.tag.substring(0,8))+'</span><div class="analysis-bar-wrap"><div class="analysis-bar" style="width:'+w.toFixed(1)+'%;background:var(--mu2)"></div></div><span class="analysis-pct">'+t.pct+'%</span></div>');
      });
      rows.push('<div style="border-top:1px solid var(--bd);margin:4px 0 2px"></div>');
    } else if(kw){
      rows.push('<div class="analysis-head">Global Tag Popularity</div>');
      rows.push('<div style="font-size:9px;color:var(--mu);padding:2px 0">loading…</div>');
      rows.push('<div style="border-top:1px solid var(--bd);margin:4px 0 2px"></div>');
    }

    rows.push('<div class="analysis-head" style="margin-bottom:2px">Top-20 Co-tags</div>');
    topTagEntries.forEach(([t,c])=>{
      const pct=Math.round(c/analysis.total*100);
      rows.push('<div class="analysis-row"><span class="analysis-label" title="'+esc(t)+'">'+esc(t.substring(0,8))+'</span><div class="analysis-bar-wrap"><div class="analysis-bar" style="width:'+pct+'%;background:#8ca0f5"></div></div><span class="analysis-pct">'+pct+'%</span></div>');
    });
    if(topChEntries.length>0)
      rows.push('<div class="analysis-row" style="margin-top:2px"><span class="analysis-label">Channel</span><span style="font-size:9px;color:#8ca0f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">'+esc(topChEntries[0][0].substring(0,16))+'</span><span class="analysis-pct">×'+topChEntries[0][1]+'</span></div>');
    summary=rows.join('');
  }

  return '<div class="vcol-analysis">'
    +(summary||'<div class="analysis-head">Tags</div>')
    +(tagPills?'<div class="analysis-tags">'+tagPills+'</div>':'<span style="color:var(--mu);font-size:9px">no tags</span>')
    +'</div>';
}


// ── POPUP ──
function openPopup(card){
  const v=JSON.parse(card.dataset.v);
  document.getElementById('pTitle').textContent=v.t||'';
  const cc=CATC[v.cat]||'#888', cn=CAT[v.cat]||'';
  document.getElementById('pMeta').innerHTML=
    '<span>'+(FLAGS[v.co]||v.co)+' '+(CNAMES[v.co]||v.co)+'</span>'
    +(cn?'<span style="background:'+cc+'22;color:'+cc+';border:1px solid '+cc+'44;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:600">'+cn+'</span>':'')
    +'<span>'+esc(v.ch)+'</span>';
  document.getElementById('pStats').innerHTML=
    '<div class="popup-stat"><span>'+fmt(v.v)+'</span><span>Views</span></div>'
    +'<div class="popup-stat"><span>'+fmt(v.l)+'</span><span>Likes</span></div>'
    +'<div class="popup-stat"><span>'+fmt(v.c)+'</span><span>Comments</span></div>'
    +(v.v>0?'<div class="popup-stat"><span>'+(v.l/v.v*100).toFixed(2)+'%</span><span>Like Rate</span></div>':'');
  const tags=(v.tg||'').split('|').map(t=>t.trim()).filter(t=>t&&t!=='[none]');
  const ts=document.getElementById('pTagSec');
  if(tags.length){document.getElementById('pTags').innerHTML=tags.map(t=>'<span class="popup-tag">'+esc(t)+'</span>').join('');ts.style.display='';}
  else ts.style.display='none';
  const ds=document.getElementById('pDescSec'), desc=(v.de||'').trim();
  if(desc){document.getElementById('pDesc').textContent=desc;ds.style.display='';}
  else ds.style.display='none';
  document.getElementById('overlay').classList.add('open');
}
function closePopup(e){
  if(!e||e.target===document.getElementById('overlay')||e.currentTarget.classList.contains('popup-close'))
    document.getElementById('overlay').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay').classList.remove('open');});
</script>
